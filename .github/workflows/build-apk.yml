name: 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 下载离线中文语音模型
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -L --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q /tmp/model.zip -d /tmp/model
          rm -rf app/src/main/assets/model-cn
          mv /tmp/model/vosk-model-small-cn-0.22 app/src/main/assets/model-cn
          du -sh app/src/main/assets/model-cn

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: xiaojingyu-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
